description: >-
  Versioning, deprecation, support and operational-transparency posture for the
  Wattwatchers REST API v3 (Mercury). Wattwatchers publishes a dated release-note
  history and an explicit (if thin) roadmap page, and states a clear major-version
  policy. It publishes NO status page, NO SLA and NO formal deprecation policy,
  and supports no RFC 8594 Sunset/Deprecation headers.
