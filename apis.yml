apis:
- aid: wattwatchers:wattwatchers-rest-api-v3
  name: Wattwatchers REST API v3 (Mercury)
  description: The Wattwatchers REST API v3, code-named Mercury — 14 documented operations
    across 13 paths, covering device inventory and configuration (including switch
    control via PATCH), 30-second "short energy" interval data, 5-minute "long energy"
    interval data, and Modbus data read from downstream devices by 6M+One hardware.
    Authentication is a Wattwatchers-issued bearer API key scoped to the devices assigned
    to that key. Version 3.6.0 of the published OpenAPI contract.
  humanURL: https://docs.wattwatchers.com.au/api/v3/index.html
