name: Wattwatchers
kind: company
description: >-
  Wattwatchers is an Australian digital energy company (founded 2007, headquartered
  in Sydney, NSW) that designs and manufactures the Auditor family of DIN-rail electricity
  monitoring and switching devices, and operates the cloud platform behind them. It
  sits behind the meter rather than at it — Auditors clamp onto individual circuits
  and report real-time, circuit-level energy data over 4G or WiFi to Wattwatchers'
  hosted platform, which resells that data to solar installers, energy retailers,
  energy services companies, EV and DER programs, schools and research trials. Its
  API posture is genuinely open at the documentation layer and closed at the data
  layer — the full REST API v3 (Mercury) reference, a live Swagger UI and a downloadable
  OpenAPI 3.0 contract are all served anonymously from docs.wattwatchers.com.au, but
  no key is self-serve: Wattwatchers issues bearer tokens by hand and scopes each
  one to the specific devices you own or manage, so the API returns your fleet's data
  and nothing else. Consumer usage data is therefore available through a documented
  API, while no open grid or market data is published at all. Wattwatchers is not a
  designated Consumer Data Right energy data holder and does not appear as an accredited
  data recipient — the CDR energy mandate applies to retailers and AEMO, not to
  behind-the-meter hardware vendors, so this platform carries no CDR obligation and
  implements no CDR or Green Button data standard.
