description: >-
  First-party Wattwatchers packages found on the public registries. Wattwatchers
  publishes NO client SDK for the REST API v3 (Mercury) in any language — the
  documentation explicitly directs developers to download the OpenAPI JSON and
  generate a client with OpenAPI Generator or Swagger Codegen instead
  (docs.wattwatchers.com.au/api/tips/openapi-spec.html). The only first-party
  published packages are two Homebridge plugins on npm, both authored by
  "Wattwatchers" under the `wattwatchers` npm maintainer account and hosted on
  the company's own Bitbucket org. They are consumer HomeKit integrations that
  consume the API, not client libraries for it, so no `SDKs` pointer is emitted
  for this provider. Registry probes recorded at fetch time.
sdk_status: none-published
sdk_note: >-
