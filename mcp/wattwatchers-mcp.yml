agent_notes:
- Energy payloads are positional arrays indexed by channel order — an agent MUST call get_device first
  to label anything it reports from get_long_energy or get_short_energy.
- 204 means the device has never reported that data class; 200 with [] means no data in the requested
  window. Do not conflate.
- Windows are hard-capped (12h Short Energy, 7d Long Energy) and over-long windows return 422, not a truncated
  result.
- Rate limits auto-scale per key; honour Retry-After and the X-RateLimit-Tps*/Tpd* headers.
