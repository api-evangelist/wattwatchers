search_result: 'No official Wattwatchers MCP server exists. Searched the MCP registry, npm (@modelcontextprotocol
  and wattwatchers scopes), the github.com/wattwatchers organization (2 repos, both Jupyter notebooks)
  and the full documentation site (22 pages) — no MCP server, no agent toolkit, no /mcp endpoint. This
  manifest is an API Evangelist-DERIVED candidate: one tool per real operationId in the published OpenAPI,
  with each tool''s input contract inherited verbatim from that operation''s parameters. It is a design
  proposal, not a Wattwatchers product.'
description: 'Candidate MCP tool surface for the Wattwatchers REST API v3 (Mercury). All 14 operations
  map cleanly to tools. Note the safety profile: 13 of 14 are safe reads, and exactly one — update_device
  — is a physical-world write that can throw a relay on a live electrical circuit. Any real deployment
  of this server should gate update_device behind human confirmation.'
server:
