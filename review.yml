aid: wattwatchers
name: Wattwatchers
review:
  question: Does Wattwatchers publish a real, documented public API surface, and does
    any energy data mandate apply to it?
  answer: true
  date: '2026-07-27'
  reviewer: API Evangelist
  bootstrap: true
  homeMarket: Australia
  tier: energy-data-platform
findings:
  summary: |
    Wattwatchers publishes a genuinely public developer documentation site at
    docs.wattwatchers.com.au (HTTP 200, anonymous, no login) covering REST API
    v3 "Mercury", including a live Swagger UI and a directly downloadable
    OpenAPI 3.0.0 contract (version 3.6.0, 13 paths / 14 operations). The
    documentation layer is open; the data layer is not. API keys are not
    self-serve — Wattwatchers issues each bearer token by hand and scopes it to
    the specific devices assigned to that key, so a developer must be a
    Wattwatchers customer or fleet manager with hardware before the API returns
    anything. No Consumer Data Right obligation applies to this organization,
    and no CDR, Green Button or ESPI data standard is implemented.
  corporateSiteNote: |
    https://wattwatchers.com.au/ and every /about/, /products/, /use-cases/ page
    returned HTTP 202 with a SiteGround captcha interstitial
    (/.well-known/sgcaptcha/) to every non-browser client tried, including
    full browser headers and cookie jar. The corporate marketing site could not
    be read programmatically on the review date. All API facts recorded here
    come from docs.wattwatchers.com.au, api-v3.wattwatchers.com.au, the
    github.com/wattwatchers organization, and the live CDR Register API — not
    from the captcha-walled marketing site.
mandate:
  regime: none
  status: not-applicable
  regimeConsidered: cdr-energy
  reasoning: |
    Australia extended the Consumer Data Right — the same statute, the same
    regulator (ACCC), the same Data Standards Body that produced the identical
    fifty-bank banking contract — into energy, with AEMO acting as gateway for
    standardised retailer data. That mandate binds ENERGY RETAILERS and AEMO as
    designated data holders. Wattwatchers is neither. It is a behind-the-meter
    hardware and platform vendor: its Auditor devices are sub-metering /
    circuit-monitoring hardware, not accredited NMI revenue meters, and it does
    not sell electricity. It therefore carries no CDR energy data-holder
    obligation, and the mandate is genuinely NOT APPLICABLE here rather than
    designated-and-unbuilt.
  verification:
  - probe: GET https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
    headers: 'x-v: 1'
    status: 200
    date: '2026-07-27'
    result: 84 designated energy data-holder brands returned. No brand matching
      "watt" / "Wattwatchers" is present. Wattwatchers is NOT a CDR energy data
      holder.
  - probe: GET https://api.cdr.gov.au/cdr-register/v1/all/data-recipients
    headers: 'x-v: 3'
    status: 200
    date: '2026-07-27'
    result: 38 accredited data recipient legal entities returned. No entity
      matching "watt" / "Wattwatchers" is present. Wattwatchers is NOT an
      accredited data recipient (ADR) either.
  - probe: full-text search of docs.wattwatchers.com.au (22 pages, all HTTP 200)
    date: '2026-07-27'
    result: No mention of Consumer Data Right, CDR, ACCC, AEMO, Consumer Data
      Standards, Green Button, ESPI, IEEE 2030.5, OpenADR, OCPP, OCPI or IEC CIM
      anywhere in the developer documentation.
  claimVsImplementation: |
    Nothing was claimed and nothing was found. This provider makes no compliance
    claim to verify, which is a cleaner result than the usual "compliance page
    with no endpoint behind it" — there is no gap between claim and
    implementation because there is no claim. Recorded as regime=none,
    status=not-applicable.
dataStandard:
  name: no standard reference found
  detail: |
    The API is a proprietary JSON/REST shape of Wattwatchers' own design. No
    consumer-energy interoperability standard is implemented or referenced:
    no Green Button / ESPI, no CDR Consumer Data Standards energy schemas, no
    IEEE 2030.5, no OpenADR, no IEC CIM 61968/61970, no OCPP/OCPI. The only
    standard named anywhere in the surface is Modbus — the industrial fieldbus
    the 6M+One hardware reads from downstream equipment — surfaced through
    /modbus/{device-id} endpoints. That is a device-side protocol, not an
    energy data-sharing standard, and must not be counted as one.
dataSplit:
  consumerDataApi: true
  consumerDataDetail: |
    A third party CAN obtain an individual customer's electricity usage through
    a documented API — that is the entire business model. GET
    /short-energy/{device-id} returns 30-second interval data, GET
    /long-energy/{device-id} returns 5-minute interval data, both at
    per-circuit (channel) granularity for a named site's device. Consent is
    handled commercially and by device assignment, not by any statutory
    consent framework: whoever Wattwatchers assigns the device to on the key
    gets the data.
  marketDataOpen: false
  marketDataDetail: |
    Wattwatchers publishes NO open grid, market, system or emissions data. There
    is no anonymous data endpoint, no open-data portal, no bulk download, no
    published dataset. Every documented endpoint requires a bearer key. The
    split is total: documented consumer/site data behind a commercial key,
    zero open market data. In Australia that market-data role belongs to AEMO,
    not to this provider.
accessGate:
  gate: customer-account-required
  gated: true
  howADeveloperGetsIn: |
    1. Buy / operate Wattwatchers Auditor hardware, or manage a fleet of it.
    2. Get access to the Fleet Management web app
       (https://fleet.wattwatchers.com.au) — "Please contact Wattwatchers
       support if you don't have the details for accessing this app."
    3. The API key is then visible under the profile menu of the Fleet app.
       For new keys the docs say: "Please contact the Wattwatchers team to have
       an API key setup. We will distribute the API key to you securely once we
       have set it up and assigned the correct devices and related permissions."
    There is no signup form, no free tier, no sandbox, no trial key, and no
    self-service key issuance anywhere in the documentation. The key is
    human-issued and device-scoped, which is why this is recorded as
    customer-account-required rather than application-approval: approval alone
    is not enough, you must own the hardware the key points at.
  documentationGate: none
  documentationGateDetail: |
    Notably the DOCS are ungated. The full endpoint reference, the auth guide,
    the rate-limit contract, the changelog, the Swagger UI and the raw OpenAPI
    JSON are all served anonymously over CloudFront/S3 with no login and no
    robots-level obstruction. A developer can fully evaluate and even generate
    a client before ever talking to a salesperson. Open docs, closed data.
authModel:
  scheme: HTTP Bearer token (API key)
  detail: |
    Authorization: Bearer key_xxxxxxxxxxxx. Declared in the OpenAPI contract as
    components.securitySchemes.BearerAuth (type: http, scheme: bearer). No
    OAuth2, no OpenID Connect, no mTLS, no CDR accreditation, no scopes. There
    is no top-level `security` array in the published spec, though every
    documented endpoint requires the header in practice — confirmed live below.
    Permissions are not expressed as scopes; they are expressed as the set of
    devices Wattwatchers assigns to the key.
  oidcDiscovery:
    probed: https://api-v3.wattwatchers.com.au/.well-known/openid-configuration
    status: 404
    result: not served — no OpenID Connect.
  rateLimits: |
    Documented and header-driven. X-RateLimit-TpdLimit / TpdRemaining /
    TpdReset (transactions per day) and X-RateLimit-TpsLimit / TpsRemaining /
    TpsReset (transactions per second, float reset). 429 returns
    TOO_MANY_REQUESTS_TPS or TOO_MANY_REQUESTS_TPD plus Retry-After. Limits
    auto-scale with the number of devices on the key.
transports:
- protocol: REST
  scheme: https
  baseURL: https://api-v3.wattwatchers.com.au
  documented: true
- protocol: Webhooks
  documented: false
  note: No webhooks, no MQTT, no WebSocket and no server-push of any kind is
    documented. The polling-data guide states verbatim that Wattwatchers is
    "exploring options to enable a stream-based 'push' API" and invites
    customers to "participate in early trials of the stream API" — an
    unshipped intention, not a surface. Integrators poll.
