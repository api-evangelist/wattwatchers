apiFamily:
  usageMetering: 'Yes — short energy (30 second intervals) and long energy (5
    minute intervals), per device and per circuit/channel, with /first and
    /latest convenience endpoints.'
  derAssetControl: 'Yes — switch state is a writable property on PATCH
    /devices/{device-id} for the +3SW hardware variants (6M+3SW, 6W+3SW,
    3RM+3SW), with a dedicated switching guide. This is real load control, but
    it is control of Wattwatchers'' own relays, not a standards-based DER
    protocol.'
  deviceConfiguration: 'Yes — CT ratings, channel labels and categories,
    phase grouping, reporting interval, all via PATCH with a pending-value
    convergence model.'
  modbus: 'Yes — /modbus endpoints expose Modbus register data read by 6M+One
    devices from downstream equipment (inverters, meters).'
  tariffsPricing: No — not exposed.
  billing: No — not exposed.
  outages: No — not exposed.
  chargingSessions: No — no OCPP/OCPI surface, despite an EV use case in
    marketing.
  emissionsCarbon: No — not exposed.
  marketData: No — not exposed.
