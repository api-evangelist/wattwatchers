identity:
  founded: 2007
  headquarters: Sydney (Rydalmere), New South Wales, Australia
  homeMarket: Australia
  valueChainPosition: |
    Behind-the-meter hardware + data platform. Not a retailer, not a network
    operator, not a metering coordinator. It sells circuit-level truth about a
    site to the parties who need it — solar and DER installers, energy services
    companies, retailers running products on top, EV programs, research trials
    — and the API is how that truth is delivered.
